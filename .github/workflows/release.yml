name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Extract version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Build and package extension
        run: |
          # scripts/release.mjs is the single source of truth for packaging:
          # it syncs the version, builds, writes the manifest version, and
          # emits a spec-compliant ZIP (forward-slash entry names) while
          # excluding the test-only bundle from the artifact.
          node scripts/release.mjs --version ${{ steps.get_version.outputs.VERSION }}
          mv "release/easytranslate-${{ steps.get_version.outputs.VERSION }}-chrome.zip" \
             "EasyTranslate-v${{ steps.get_version.outputs.VERSION }}.zip"
          ls -la EasyTranslate-v*.zip

      - name: Verify the packaged archive
        run: node scripts/verify_release.mjs "EasyTranslate-v${{ steps.get_version.outputs.VERSION }}.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: EasyTranslate-v*.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
